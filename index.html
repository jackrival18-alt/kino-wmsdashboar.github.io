<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KINO WMS Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #1e293b, #334155);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      text-align: center;
    }

    .glass {
      background: rgba(255, 255, 255, 0.10);
      border: 1px solid rgba(255, 255, 255, 0.20);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-radius: 24px;
      padding: 50px 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.30);
    }

    .logo {
      font-size: 48px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 18px;
      opacity: 0.8;
      margin-bottom: 40px;
    }

    .welcome {
      font-size: 28px;
      margin-bottom: 12px;
    }

    .description {
      opacity: 0.75;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      padding: 15px 35px;
      border-radius: 12px;
      background: white;
      color: #0f172a;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.35);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-top: 35px;
    }

    .card {
      padding: 25px 15px;
      border-radius: 18px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
    }

    .card h3 {
      margin-bottom: 8px;
    }

    .card p {
      font-size: 14px;
      opacity: 0.7;
    }

    .footer {
      margin-top: 30px;
      font-size: 13px;
      opacity: 0.5;
    }

    @media (max-width: 700px) {
      .cards {
        grid-template-columns: 1fr;
      }

      .logo {
        font-size: 36px;
      }

      .glass {
        padding: 40px 20px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="glass">

      <div class="logo">
        KINO WMS
      </div>

      <div class="subtitle">
        Warehouse Management System
      </div>

      <div class="welcome">
        Welcome to KINO WMS Dashboard
      </div>

      <div class="description">
        Centralized portal for Warehouse & Delivery Management
      </div>

      <!-- GANTI LINK INI DENGAN LINK GOOGLE APPS SCRIPT WMS -->
      <a
        href="https://script.google.com/"
        target="_blank"
        class="btn">
        OPEN WMS
      </a>

      <div class="cards">

        <div class="card">
          <h3>Planning</h3>
          <p>Delivery Planning & Monitoring</p>
        </div>

        <div class="card">
          <h3>Monitoring</h3>
          <p>PG & DO Monitoring</p>
        </div>

        <div class="card">
          <h3>Gate Flow</h3>
          <p>Gate & Cross Docking</p>
        </div>

      </div>

      <div class="footer">
        KINO WMS Dashboard
      </div>

    </div>

  </div>

</body>
</html>
