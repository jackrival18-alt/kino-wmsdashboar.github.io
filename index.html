<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KINO WMS Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --glass: rgba(255,255,255,0.105);
      --glass-strong: rgba(255,255,255,0.145);
      --border: rgba(255,255,255,0.22);
      --text: #f8fafc;
      --muted: rgba(248,250,252,0.70);
      --blue: #7dd3fc;
    }

    html {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      overflow-x: hidden;

      /* Premium night-city atmosphere without external dependencies */
      background:
        radial-gradient(circle at 15% 15%, rgba(56,189,248,0.24), transparent 27%),
        radial-gradient(circle at 82% 18%, rgba(129,140,248,0.20), transparent 25%),
        radial-gradient(circle at 70% 85%, rgba(14,165,233,0.14), transparent 28%),
        linear-gradient(135deg, #030712 0%, #0b1426 45%, #16243b 100%);
      position: relative;
    }

    /* Ambient light */
    body::before,
    body::after {
      content: "";
      position: fixed;
      pointer-events: none;
      border-radius: 50%;
      filter: blur(45px);
      z-index: 0;
    }

    body::before {
      width: 280px;
      height: 280px;
      left: -90px;
      top: 12%;
      background: rgba(56,189,248,0.13);
    }

    body::after {
      width: 340px;
      height: 340px;
      right: -120px;
      bottom: 5%;
      background: rgba(99,102,241,0.12);
    }

    .container {
      width: 100%;
      max-width: 1060px;
      position: relative;
      z-index: 1;
    }

    .glass {
      position: relative;
      overflow: hidden;
      text-align: center;
      padding: 62px 52px 34px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.145),
          rgba(255,255,255,0.055)
        );

      border: 1px solid var(--border);
      border-radius: 30px;

      backdrop-filter: blur(25px) saturate(135%);
      -webkit-backdrop-filter: blur(25px) saturate(135%);

      box-shadow:
        0 35px 90px rgba(0,0,0,0.42),
        inset 0 1px 0 rgba(255,255,255,0.22),
        inset 0 -1px 0 rgba(255,255,255,0.04);

      animation: enter 0.8s ease-out;
    }

    /* Glass shine */
    .glass::before {
      content: "";
      position: absolute;
      width: 520px;
      height: 520px;
      top: -390px;
      right: -160px;
      border-radius: 50%;
      background: rgba(125,211,252,0.11);
      filter: blur(8px);
      pointer-events: none;
    }

    .glass::after {
      content: "";
      position: absolute;
      left: 8%;
      right: 8%;
      top: 0;
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.42),
        transparent
      );
      pointer-events: none;
    }

    .logo {
      position: relative;
      font-size: clamp(40px, 6vw, 58px);
      line-height: 1;
      font-weight: 900;
      letter-spacing: 5px;
      margin-bottom: 13px;
      text-shadow:
        0 4px 24px rgba(0,0,0,0.35),
        0 0 34px rgba(125,211,252,0.12);
    }

    .subtitle {
      font-size: 17px;
      color: var(--muted);
      letter-spacing: 0.8px;
      margin-bottom: 46px;
    }

    .welcome {
      font-size: clamp(24px, 3.5vw, 34px);
      font-weight: 600;
      letter-spacing: -0.4px;
      margin-bottom: 12px;
    }

    .description {
      color: var(--muted);
      font-size: 15px;
      margin-bottom: 31px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 190px;
      padding: 16px 34px;

      border-radius: 15px;
      border: 1px solid rgba(255,255,255,0.72);

      background: rgba(255,255,255,0.94);
      color: #0b1628;
      text-decoration: none;
      font-weight: 800;
      letter-spacing: 0.6px;

      box-shadow:
        0 12px 35px rgba(0,0,0,0.27),
        inset 0 1px 0 rgba(255,255,255,1);

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        background 0.25s ease;
    }

    .btn:hover {
      transform: translateY(-4px);
      background: #ffffff;
      box-shadow:
        0 18px 42px rgba(0,0,0,0.32),
        0 0 30px rgba(125,211,252,0.18);
    }

    .btn:active {
      transform: translateY(-1px);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-top: 42px;
    }

    .card {
      position: relative;
      overflow: hidden;
      padding: 28px 18px 26px;
      min-height: 126px;

      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.17);

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.12),
          rgba(255,255,255,0.045)
        );

      backdrop-filter: blur(17px);
      -webkit-backdrop-filter: blur(17px);

      box-shadow:
        0 14px 32px rgba(0,0,0,0.19),
        inset 0 1px 0 rgba(255,255,255,0.10);

      transition:
        transform 0.28s ease,
        border-color 0.28s ease,
        box-shadow 0.28s ease;
    }

    .card::before {
      content: "";
      position: absolute;
      width: 120px;
      height: 120px;
      right: -60px;
      top: -62px;
      border-radius: 50%;
      background: rgba(125,211,252,0.11);
      filter: blur(3px);
    }

    .card:hover {
      transform: translateY(-7px);
      border-color: rgba(186,230,253,0.38);
      box-shadow:
        0 22px 45px rgba(0,0,0,0.28),
        0 0 28px rgba(56,189,248,0.08),
        inset 0 1px 0 rgba(255,255,255,0.16);
    }

    .card h3 {
      position: relative;
      z-index: 1;
      font-size: 20px;
      font-weight: 750;
      margin-bottom: 10px;
    }

    .card p {
      position: relative;
      z-index: 1;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .footer {
      margin-top: 32px;
      color: rgba(248,250,252,0.43);
      font-size: 12px;
      letter-spacing: 0.4px;
    }

    @keyframes enter {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (max-width: 700px) {
      body {
        padding: 14px;
      }

      .glass {
        padding: 42px 18px 28px;
        border-radius: 24px;
      }

      .logo {
        letter-spacing: 3px;
      }

      .subtitle {
        margin-bottom: 34px;
      }

      .welcome {
        font-size: 23px;
      }

      .description {
        line-height: 1.5;
      }

      .btn {
        width: 100%;
        max-width: 250px;
      }

      .cards {
        grid-template-columns: 1fr;
        gap: 13px;
        margin-top: 31px;
      }

      .card {
        min-height: auto;
        padding: 22px 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .glass,
      .card,
      .btn {
        animation: none;
        transition: none;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="glass">

      <div class="logo">
        KINO WMS
      </div>

      <div class="subtitle">
        Warehouse Management System
      </div>

      <div class="welcome">
        Welcome to KINO WMS Dashboard
      </div>

      <div class="description">
        Centralized portal for Warehouse &amp; Delivery Management
      </div>

      <!-- LINK WMS TETAP SAMA -->
      <a
        href="https://script.google.com/macros/s/AKfycbyVI65TG-0qEflyjADljujwxveXHbY-KISiV0bGpJoOIvQ4Kb7jwkr5bUFGpPBcB_GV9g/exec"
        target="_blank"
        class="btn">
        OPEN WMS
      </a>

      <div class="cards">

        <div class="card">
          <h3>Planning</h3>
          <p>Delivery Planning &amp; Monitoring</p>
        </div>

        <div class="card">
          <h3>Monitoring</h3>
          <p>PG &amp; DO Monitoring</p>
        </div>

        <div class="card">
          <h3>Gate Flow</h3>
          <p>Gate &amp; Cross Docking</p>
        </div>

      </div>

      <div class="footer">
        KINO WMS Dashboard
      </div>

    </div>
  </div>

</body>
</html>
